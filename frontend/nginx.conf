server {
    listen 80 default_server;
    # Also bind IPv6: in nginx:1.29-alpine the container's `localhost` resolves to ::1 first, and the
    # health check's wget fails with "connection refused" if nginx only listens on IPv4.
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # NOTE: nginx add_header inheritance — any location with its own add_header
    # loses these, so they are re-declared in /index.html and /assets/ below.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/wasm;
    gzip_min_length 256;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sl_backend shared-ledger-backend;
        proxy_pass http://$sl_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Match the backend's 5MB multipart cap (nginx default is 1m, which would
        # 413 CSV imports before they ever reach the backend).
        client_max_body_size 5m;
    }

    location / {
        try_files $uri /index.html;
    }
}
