<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shared Ledger</title>
    <link rel="icon" type="image/png" href="/SharedLedgerTabIcon.png" />
    <meta name="theme-color" content="#0ea5e9" />
    <script>
      // Apply persisted theme before React mounts to avoid a flash of the wrong theme. "system" never
      // resolves to OLED, so only an explicit choice adds the class.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var oled = stored === "oled";
          var dark = oled || stored === "dark" || ((!stored || stored === "system") && prefersDark);
          if (dark) document.documentElement.classList.add("dark");
          if (oled) {
            document.documentElement.classList.add("oled");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-gray-900 antialiased dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
