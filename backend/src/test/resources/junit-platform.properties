# Test classes run concurrently against the one shared Spring context; methods within a class stay on
# one thread, which is what the @BeforeEach fixtures already assume. Booting that context is the suite's
# single largest cost and cannot be parallelised, so four threads is where the returns flatten out —
# past that the run is just waiting on startup.
#
# Classes sharing a mutable singleton stub carry a @ResourceLock naming it (fake-bank-connector,
# stub-price-providers). A new test that seeds a stub bean or writes to a table keyed globally rather
# than per household — asset prices, fx rates, benchmark series — needs the same lock.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
