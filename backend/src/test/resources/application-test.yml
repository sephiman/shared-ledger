spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  auto-snapshot:
    # Never fires in tests; the job is invoked directly.
    cron: "0 0 0 29 2 ?"
  portfolio:
    # Never fire in tests; refresh methods are invoked directly.
    crypto-refresh-cron: "0 0 0 29 2 ?"
    fx-refresh-cron: "0 0 0 29 2 ?"
    equity-refresh-cron: "0 0 0 29 2 ?"
    benchmark-refresh-cron: "0 0 0 29 2 ?"
    # No provider HTTP at startup; benchmark refresh is invoked directly in its test.
    benchmark-backfill-on-start: false
    coingecko:
      min-request-interval-ms: 0
    binance:
      min-request-interval-ms: 0
    yahoo:
      min-request-interval-ms: 0
    eodhd:
      min-request-interval-ms: 0
    twelvedata:
      min-request-interval-ms: 0
    frankfurter:
      min-request-interval-ms: 0
  telegram:
    # Deterministic 32-byte AES key (base64 of "01234567890123456789012345678901") for tests.
    token-key: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
  enable-banking:
    # Present so the feature reads as "configured" in tests; the fake connector replaces the real
    # HTTP client, so app-id/private-key are never actually used to sign JWTs.
    app-id: "test-app"
    private-key: "test-key"
    secret-key: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
    sync-cron: "0 0 0 29 2 ?"
    reminder-cron: "0 0 0 29 2 ?"
    min-request-interval-ms: 0
    backfill-days: 90
  registration:
    mode: invite-only
  bootstrap:
    admin-email: "admin@example.com"
    admin-password: "TestAdminPass123!"
    household-name: "TestHome"
    household-currency: "EUR"
    household-locale: "en"
