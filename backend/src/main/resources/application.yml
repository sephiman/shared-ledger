spring:
  application:
    name: shared-ledger
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sharedledger}
    username: ${DB_USERNAME:sharedledger}
    password: ${DB_PASSWORD:sharedledger}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: sharedledger-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
    timeout: 30d
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: ${APP_COOKIE_SECURE:true}
        same-site: lax
        max-age: 30d
  forward-headers-strategy: framework
  shutdown: graceful

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: shared-ledger

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        app: shared-ledger

app:
  security:
    cookie-secure: ${APP_COOKIE_SECURE:true}
    login-rate:
      per-minute: 5
      per-hour: 20
    import-rate:
      per-hour: 10
  registration:
    mode: ${REGISTRATION_MODE:invite-only}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    household-name: ${BOOTSTRAP_HOUSEHOLD_NAME:Home}
    household-currency: ${BOOTSTRAP_HOUSEHOLD_CURRENCY:EUR}
    household-locale: ${BOOTSTRAP_HOUSEHOLD_LOCALE:en}
  invitations:
    ttl-days: 14
  scheduler:
    recurring-cron: "0 0 2 * * *"
    timezone: UTC
  fire:
    monte-carlo-trials: ${FIRE_MONTE_CARLO_TRIALS:10000}
  telegram:
    base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    timeout-ms: ${TELEGRAM_TIMEOUT_MS:5000}
    token-key: ${TELEGRAM_TOKEN_KEY:}
