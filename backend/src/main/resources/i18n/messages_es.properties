# Errores genéricos
INTERNAL_ERROR=Error inesperado
VALIDATION_FAILED=Error de validación
INVALID_PARAMETER=Parámetro no válido: {0}
DATA_INTEGRITY_VIOLATION=Conflicto con datos existentes
UNAUTHORIZED=Se requiere autenticación
FORBIDDEN=Acceso denegado
NOT_FOUND=Recurso no encontrado
RATE_LIMITED=Demasiadas solicitudes, inténtalo de nuevo más tarde

# Autenticación
INVALID_CREDENTIALS=Email o contraseña no válidos
PASSWORD_MISMATCH=La contraseña actual no es correcta
EMAIL_ALREADY_REGISTERED=El email ya está registrado

# Registro
REGISTRATION_DISABLED=El registro está deshabilitado
REGISTRATION_REQUIRES_INVITATION=El registro requiere una invitación válida
REGISTRATION_HOUSEHOLD_REQUIRED=Se requieren los datos de la nueva unidad familiar cuando se registra sin invitación

# Invitaciones
INVITATION_INVALID=La invitación no es válida
INVITATION_EXPIRED=La invitación ha caducado
INVITATION_ALREADY_ACCEPTED=La invitación ya ha sido aceptada
INVITATION_REVOKED=La invitación ha sido revocada

# Unidad familiar
NOT_A_HOUSEHOLD_MEMBER=No eres miembro de esta unidad familiar
NOT_HOUSEHOLD_OWNER=Solo los propietarios pueden realizar esta acción
HOUSEHOLD_NOT_FOUND=Unidad familiar no encontrada
WIPE_CONFIRMATION_REQUIRED=Escribe "delete" para confirmar

# Transacciones
CATEGORY_DIRECTION_MISMATCH=La categoría no coincide con el tipo elegido
CATEGORY_NOT_FOUND=Categoría no encontrada
TRANSACTION_NOT_FOUND=Transacción no encontrada

# Recurrentes
RECURRING_TEMPLATE_NOT_FOUND=Plantilla recurrente no encontrada
RECURRING_CADENCE_FIELDS_INVALID=Los campos de cadencia no son válidos

# Presupuestos
BUDGET_REQUIRES_EXPENSE_CATEGORY=Los presupuestos solo se pueden aplicar a categorías de gasto
BUDGET_NOT_FOUND=Presupuesto no encontrado

# Patrimonio
LIABILITY_NOT_FOUND=Pasivo no encontrado
SNAPSHOT_NOT_FOUND=Instantánea no encontrada
SNAPSHOT_MISSING_ASSET_VALUES=Todas las clases de activos deben estar presentes en la instantánea
SNAPSHOT_MISSING_LIABILITY_BALANCES=Todos los pasivos activos deben estar presentes en la instantánea
SNAPSHOT_REQUIRES_DELTA_CONFIRMATION=Uno o más valores cambiaron más del 50%. Confirma para guardar.
MOVEMENT_NOT_FOUND=Movimiento no encontrado
MOVEMENT_TARGET_INVALID=El destino del movimiento no coincide con el tipo elegido

# Importación
IMPORT_FILE_EMPTY=El archivo subido está vacío
IMPORT_PARSE_FAILED=No se pudo analizar el archivo. Comprueba el separador (punto y coma) y el entrecomillado.
IMPORT_HEADER_INVALID=La fila de cabecera no es válida: {0}
IMPORT_VALIDATION_FAILED=El archivo de importación contiene errores de validación. Corrígelos e inténtalo de nuevo.
IMPORT_DATE_INVALID=La fecha debe estar en formato AAAA-MM-DD
IMPORT_DATE_FAR_FUTURE=La fecha está a más de un año en el futuro
IMPORT_DIRECTION_INVALID=El tipo debe ser "income" o "expense"
IMPORT_CATEGORY_UNKNOWN=El código de categoría no está en el catálogo
IMPORT_CATEGORY_DIRECTION_MISMATCH=La categoría no coincide con el tipo elegido
IMPORT_AMOUNT_INVALID=El importe debe ser un número positivo con la coma como separador decimal
IMPORT_DESCRIPTION_TOO_LONG=La descripción no puede exceder los 500 caracteres
IMPORT_TIMESTAMP_INVALID=La marca de tiempo debe estar en formato ISO 8601 (p. ej. 2024-03-05T18:22:11Z)
IMPORT_KIND_INVALID=El tipo de fila debe ser "asset" o "liability"
IMPORT_ASSET_CLASS_UNKNOWN=El código de clase de activo no está en el catálogo
IMPORT_LIABILITY_UNKNOWN=No existe un pasivo con ese nombre en esta unidad familiar
IMPORT_LIABILITY_INACTIVE=El pasivo existe pero está inactivo; actívalo antes de importar
IMPORT_VALUE_INVALID=El valor debe ser un número no negativo con la coma como separador decimal
IMPORT_SNAPSHOT_NOTE_MISMATCH=Todas las filas de la misma fecha deben compartir la misma nota
IMPORT_SNAPSHOT_DUPLICATE_KEY=La misma combinación tipo/clave aparece más de una vez para esta fecha
IMPORT_SNAPSHOT_MISSING_ASSET_VALUES=Cada fecha de instantánea debe incluir todas las clases de activos
IMPORT_SNAPSHOT_MISSING_LIABILITIES=Cada fecha de instantánea debe incluir todos los pasivos activos
IMPORT_SNAPSHOT_DATE_COLLISION=Ya existe una instantánea en esta fecha
IMPORT_MOVEMENT_TYPE_INVALID=El tipo de movimiento debe ser contribution, withdrawal o debt_payment
IMPORT_MOVEMENT_ASSET_REQUIRED=Las filas de aportación o retiro deben incluir asset_class_code
IMPORT_MOVEMENT_LIABILITY_REQUIRED=Las filas de pago de deuda deben incluir liability_name
IMPORT_MOVEMENT_TARGET_MISMATCH=El destino no coincide con el tipo de movimiento

# Validación
validation.required=Este campo es obligatorio
validation.amount.positive=El importe debe ser mayor que cero
validation.email.invalid=Email no válido
validation.password.length=La contraseña debe tener al menos 8 caracteres
validation.invalid=Valor no válido
