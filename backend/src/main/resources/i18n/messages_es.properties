IMPORT_SNAPSHOT_MISSING_LIABILITIES=Cada fecha de instantánea debe incluir todos los pasivos activos
IMPORT_SNAPSHOT_DATE_COLLISION=Ya existe una instantánea en esta fecha
IMPORT_MOVEMENT_TYPE_INVALID=El tipo de movimiento debe ser contribution, withdrawal o debt_payment
