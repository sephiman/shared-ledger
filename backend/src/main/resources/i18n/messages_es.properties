IMPORT_BORROWER_REQUIRED=El nombre del prestatario es obligatorio
IMPORT_BORROWER_TOO_LONG=El nombre del prestatario debe tener 120 caracteres o menos
IMPORT_INTEREST_TYPE_INVALID=El tipo de interés debe ser none, simple o compound
IMPORT_RATE_REQUIRED=Se requiere una tasa de interés anual para interés simple o compuesto
IMPORT_RATE_NOT_ALLOWED=Un préstamo sin interés no puede tener tasa de interés
IMPORT_COMPOUNDING_INVALID=El periodo de capitalización debe ser monthly o yearly para interés compuesto
IMPORT_COMPOUNDING_NOT_ALLOWED=El periodo de capitalización solo se permite con interés compuesto
IMPORT_STATUS_INVALID=El estado debe ser active, settled o written_off
IMPORT_LOAN_UNKNOWN=Ningún préstamo coincide con este borrower_name y loan_start_date
IMPORT_LOAN_AMBIGUOUS=Varios préstamos coinciden con este borrower_name y loan_start_date; no se puede desambiguar

