# Generic errors
INTERNAL_ERROR=Unexpected error
VALIDATION_FAILED=Validation failed
INVALID_PARAMETER=Invalid parameter: {0}
DATA_INTEGRITY_VIOLATION=Conflict with existing data
UNAUTHORIZED=Authentication required
FORBIDDEN=Access denied
NOT_FOUND=Resource not found
RATE_LIMITED=Too many requests, please try again later

# Auth
INVALID_CREDENTIALS=Invalid email or password
PASSWORD_MISMATCH=Current password is incorrect
EMAIL_ALREADY_REGISTERED=Email is already registered

# Registration
REGISTRATION_DISABLED=Registration is disabled
REGISTRATION_REQUIRES_INVITATION=Registration requires a valid invitation
REGISTRATION_HOUSEHOLD_REQUIRED=New household details are required when registering without an invitation

# Invitations
INVITATION_INVALID=Invitation is not valid
INVITATION_EXPIRED=Invitation has expired
INVITATION_ALREADY_ACCEPTED=Invitation has already been accepted
INVITATION_REVOKED=Invitation has been revoked

# Household
NOT_A_HOUSEHOLD_MEMBER=You are not a member of this household
NOT_HOUSEHOLD_OWNER=Only household owners can perform this action
HOUSEHOLD_NOT_FOUND=Household not found
WIPE_CONFIRMATION_REQUIRED=Type "delete" to confirm

# Transactions
CATEGORY_DIRECTION_MISMATCH=Category does not match the chosen direction
CATEGORY_NOT_FOUND=Category not found
TRANSACTION_NOT_FOUND=Transaction not found
# Recurring
RECURRING_TEMPLATE_NOT_FOUND=Recurring template not found
RECURRING_CADENCE_FIELDS_INVALID=Cadence fields are not valid for the chosen cadence

# Budgets
BUDGET_REQUIRES_EXPENSE_CATEGORY=Budgets can only be set on expense categories
BUDGET_NOT_FOUND=Budget not found

# Net worth
LIABILITY_NOT_FOUND=Liability not found
SNAPSHOT_NOT_FOUND=Snapshot not found
SNAPSHOT_MISSING_ASSET_VALUES=All asset classes must be present in the snapshot
SNAPSHOT_MISSING_LIABILITY_BALANCES=All active liabilities must be present in the snapshot
SNAPSHOT_REQUIRES_DELTA_CONFIRMATION=One or more values changed by more than 50%. Please confirm to save.
MOVEMENT_NOT_FOUND=Movement not found
MOVEMENT_TARGET_INVALID=Movement target does not match the chosen type

# Import
IMPORT_FILE_EMPTY=Uploaded file is empty
IMPORT_PARSE_FAILED=The file could not be parsed. Check the separator (semicolon) and quoting.
IMPORT_HEADER_INVALID=Header row is invalid: {0}
IMPORT_VALIDATION_FAILED=Import file has validation errors. Fix them and try again.
IMPORT_DATE_INVALID=Date must be in YYYY-MM-DD format
IMPORT_DATE_FAR_FUTURE=Date is more than a year in the future
IMPORT_DIRECTION_INVALID=Direction must be either "income" or "expense"
IMPORT_CATEGORY_UNKNOWN=Category code is not in the catalog
IMPORT_CATEGORY_DIRECTION_MISMATCH=Category does not match the chosen direction
IMPORT_AMOUNT_INVALID=Amount must be a positive number using comma as decimal separator
IMPORT_DESCRIPTION_TOO_LONG=Description must be 500 characters or fewer
IMPORT_TIMESTAMP_INVALID=Timestamp must be ISO 8601 (e.g. 2024-03-05T18:22:11Z)
IMPORT_KIND_INVALID=Kind must be either "asset" or "liability"
IMPORT_ASSET_CLASS_UNKNOWN=Asset class code is not in the catalog
IMPORT_LIABILITY_UNKNOWN=Liability with this name does not exist in this household
IMPORT_LIABILITY_INACTIVE=Liability exists but is inactive; reactivate it before importing
IMPORT_VALUE_INVALID=Value must be a non-negative number using comma as decimal separator
IMPORT_SNAPSHOT_NOTE_MISMATCH=All rows for the same date must share the same note
IMPORT_SNAPSHOT_DUPLICATE_KEY=Same kind/key appears more than once for this date
IMPORT_SNAPSHOT_MISSING_ASSET_VALUES=All asset classes must be present for each snapshot date
IMPORT_SNAPSHOT_MISSING_LIABILITIES=All currently active liabilities must be present for each snapshot date
IMPORT_SNAPSHOT_DATE_COLLISION=A snapshot already exists on this date
IMPORT_MOVEMENT_TYPE_INVALID=Movement type must be contribution, withdrawal, or debt_payment
IMPORT_MOVEMENT_ASSET_REQUIRED=Contribution and withdrawal rows must include an asset_class_code
IMPORT_MOVEMENT_LIABILITY_REQUIRED=Debt-payment rows must include a liability_name
IMPORT_MOVEMENT_TARGET_MISMATCH=Target does not match the movement type

