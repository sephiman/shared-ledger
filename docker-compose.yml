services:
  backend:
    build:
      context: ./backend
    image: shared-ledger-backend:latest
    container_name: shared-ledger-backend
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite-only}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BOOTSTRAP_HOUSEHOLD_NAME: ${BOOTSTRAP_HOUSEHOLD_NAME:-Home}
      BOOTSTRAP_HOUSEHOLD_CURRENCY: ${BOOTSTRAP_HOUSEHOLD_CURRENCY:-EUR}
      BOOTSTRAP_HOUSEHOLD_LOCALE: ${BOOTSTRAP_HOUSEHOLD_LOCALE:-en}
      TELEGRAM_TOKEN_KEY: ${TELEGRAM_TOKEN_KEY:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_TIMEOUT_MS: ${TELEGRAM_TIMEOUT_MS:-5000}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      EQUITY_PRICE_PROVIDER: ${EQUITY_PRICE_PROVIDER:-yahoo}
      EODHD_API_KEY: ${EODHD_API_KEY:-}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
      COINGECKO_API_BASE_URL: ${COINGECKO_API_BASE_URL:-https://api.coingecko.com}
      BINANCE_API_BASE_URL: ${BINANCE_API_BASE_URL:-https://api.binance.com}
      YAHOO_API_BASE_URL: ${YAHOO_API_BASE_URL:-https://query1.finance.yahoo.com}
      YAHOO_API_FALLBACK_BASE_URL: ${YAHOO_API_FALLBACK_BASE_URL:-https://query2.finance.yahoo.com}
      EODHD_API_BASE_URL: ${EODHD_API_BASE_URL:-https://eodhd.com}
      TWELVEDATA_API_BASE_URL: ${TWELVEDATA_API_BASE_URL:-https://api.twelvedata.com}
      FRANKFURTER_API_BASE_URL: ${FRANKFURTER_API_BASE_URL:-https://api.frankfurter.dev}
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      ENABLE_BANKING_SECRET_KEY: ${ENABLE_BANKING_SECRET_KEY:-}
      ENABLE_BANKING_REDIRECT_URL: ${ENABLE_BANKING_REDIRECT_URL:-}
      ENABLE_BANKING_BASE_URL: ${ENABLE_BANKING_BASE_URL:-https://api.enablebanking.com}
      ENABLE_BANKING_CONSENT_VALID_DAYS: ${ENABLE_BANKING_CONSENT_VALID_DAYS:-90}
      ENABLE_BANKING_BACKFILL_DAYS: ${ENABLE_BANKING_BACKFILL_DAYS:-90}
      ENABLE_BANKING_TIMEOUT_MS: ${ENABLE_BANKING_TIMEOUT_MS:-15000}
      ENABLE_BANKING_MAX_CALLS_PER_DAY: ${ENABLE_BANKING_MAX_CALLS_PER_DAY:-4}
      FIRE_MONTE_CARLO_TRIALS: ${FIRE_MONTE_CARLO_TRIALS:-10000}
      JAVA_OPTS: ${JAVA_OPTS:-}
    networks:
      - my-network
    expose:
      - "8080"
      - "9090"
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9090/actuator/health/liveness | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    image: shared-ledger-frontend:latest
    container_name: shared-ledger-frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - my-network
    ports:
      - "${FRONTEND_BIND_ADDR:-0.0.0.0}:${FRONTEND_PORT:-8087}:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Externally-managed Postgres on a shared Docker network.
# The backend joins this network and resolves Postgres by DNS alias = DB_HOST.
# SHARED_NETWORK_NAME defaults to "all_dockers" but can be overridden via .env.
networks:
  my-network:
    external: true
    name: ${SHARED_NETWORK_NAME:-all_dockers}